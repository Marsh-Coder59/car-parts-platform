<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Partora — Automotive Parts Marketplace" />
    <title>Partora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!--
      Applies the last-known theme before React even loads, so there's no
      flash of the wrong theme on refresh. This only reads the browser's
      local cache (updated by ThemeContext whenever the theme changes);
      the account's saved preference from the server still wins once
      auth resolves, via ThemeContext syncing to user.theme_preference.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('partora_theme');
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
